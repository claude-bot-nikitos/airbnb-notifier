[package]
name = "airbnb-notifier"
version = "0.1.0"
edition = "2024"

[dependencies]
ureq = { version = "2", features = ["json", "gzip", "socks-proxy"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
signal-hook = "0.3"
base64 = "0.22"
percent-encoding = "2"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
