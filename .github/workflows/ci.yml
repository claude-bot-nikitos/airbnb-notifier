name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Runs every test (unit, integration, end-to-end) and fails if line
      # coverage of src/ drops below 98%.
      - run: cargo llvm-cov --all-targets --ignore-filename-regex '/tests/' --fail-under-lines 98

  # The Raspberry Pi build: a static aarch64 binary, tested under qemu.
  test-aarch64:
    runs-on: ubuntu-latest
    env:
      CC_aarch64_unknown_linux_musl: clang
      CFLAGS_aarch64_unknown_linux_musl: --target=aarch64-unknown-linux-musl
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUNNER: qemu-aarch64-static
      TEST_BIN_RUNNER: qemu-aarch64-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static clang
      - run: cargo test --target aarch64-unknown-linux-musl
